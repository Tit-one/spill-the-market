[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spill-the-market"
version = "0.1.0"
description = "A local-first, evidence-aware laboratory for product launches and adaptive media plans."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "numpy>=2.0,<3", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5",
  "platformdirs>=4,<5", "typer>=0.12,<1",
  "psutil>=6,<8", "tzdata>=2024",
]

[project.scripts]
spill-market = "spill_market.cli:main"

[project.optional-dependencies]
graphiti = ["neo4j>=5.26,<6"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/spill_market"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD-PARTY-NOTICES.md" = "spill_market/web/third-party-notices.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
