name: Verify package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv build
      - name: Install wheel in isolated environment
        shell: bash
        run: |
          python -m venv .wheel-test
          if [ -f .wheel-test/Scripts/python.exe ]; then PY=.wheel-test/Scripts/python.exe; else PY=.wheel-test/bin/python; fi
          "$PY" -m pip install dist/*.whl
          "$PY" -c "from spill_market.api import create_app; from pathlib import Path; import spill_market; assert (Path(spill_market.__file__).parent / 'web/index.html').is_file()"
